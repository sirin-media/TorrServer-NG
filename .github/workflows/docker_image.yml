name: Release Docker multi arch

on:
  push:
    branches:
      - master
    tags:
      - "**"

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: docker (${{ matrix.variant }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            dockerfile: ./Dockerfile
            platforms: linux/amd64,linux/arm64,linux/arm/v7
            tag_prefix: ""
          - variant: gst
            dockerfile: ./Dockerfile.gst
            # no linux/arm/v7: the gst code is not built for 32-bit ARM
            platforms: linux/amd64,linux/arm64
            tag_prefix: "gst-"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case repository name
        run: |
          echo "REG_REPO=${REPO,,}" >>${GITHUB_ENV}
        env:
          REPO: "${{ github.repository }}"

      - name: Set version
        id: version
        run: |
          set -euo pipefail
          # keep only [A-Za-z0-9._-]: the value goes into `-ldflags "-X ...=${VERSION}"`
          sanitize() { printf '%s' "$1" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-*//; s/-*$//'; }

          SERVER_VERSION=$(awk -F'"' '/Version = "/ { print $2; exit }' server/version/version.go)
          if [ -z "$SERVER_VERSION" ]; then
            echo "::error::cannot read Version from server/version/version.go"
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION=$(sanitize "$GITHUB_REF_NAME")
          else
            VERSION="$(sanitize "$SERVER_VERSION").${GITHUB_SHA:0:7}"
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.REG_REPO }}
          tags: |
            type=raw,value=${{ matrix.tag_prefix }}master,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=${{ matrix.tag_prefix }}${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ matrix.tag_prefix }}latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=gst,enable=${{ matrix.variant == 'gst' && github.ref == 'refs/heads/master' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REACT_APP_TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=docker-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.variant }}
